version: 2
updates:
  # Keeps the commit hashes pinned in the workflows current.
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    # Leaves time for a bad release of an action to be noticed and withdrawn.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
