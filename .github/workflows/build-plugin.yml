# Builds and publishes the plugin for Linux, Windows and macOS.
#
# Stable:  a push to main publishes a release when plugin.json holds a
#          MAJOR.MINOR.REVISION version that has no v<version> tag yet.
#          Any other push to main stops after the plan job.
# Nightly: run this workflow manually on dev, either from the Actions tab or with
#            gh workflow run build-plugin.yml --ref dev
#          It replaces the single rolling pre-release.
# No other branch gets a release.
#
# To move to a new Rack SDK, update RACK_SDK_VERSION, the toolchain image digest
# and the two sdk-sha256 values together.
name: Build VCV Rack Plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

# Jobs opt in to the access they need, so a compromised step in a build job
# cannot write to the repository.
permissions: {}

# A newer nightly supersedes one still building. A stable release is never cut short.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  RACK_SDK_VERSION: 2.6.6
  RACK_TOOLCHAIN_DIR: /home/build/rack-plugin-toolchain
  NIGHTLY_TAG: Nightly

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide what to release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -er '.version' plugin.json)
          channel=none
          tag=''

          case "$GITHUB_REF" in
            refs/heads/main)
              # Asking whether the tag exists, rather than diffing against the
              # previous commit, catches a version bump anywhere in a push and
              # lets a failed release be re-run.
              if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "::warning::plugin.json version '$version' is not MAJOR.MINOR.REVISION, so nothing was released."
              else
                tag="v$version"
                existing=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" \
                  --jq "map(select(.ref == \"refs/tags/$tag\")) | length")
                if [[ $existing -eq 0 ]]; then
                  channel=stable
                else
                  echo "::notice::$tag is already released, so there is nothing to build."
                fi
              fi
              ;;
            refs/heads/dev)
              channel=nightly
              tag=$NIGHTLY_TAG
              version="$version-${GITHUB_SHA::7}"
              ;;
            *)
              echo "::error::Releases are only built from main and dev, not from $GITHUB_REF_NAME."
              exit 1
              ;;
          esac

          {
            echo "channel=$channel"
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          echo "Channel: \`$channel\`, version: \`$version\`" >> "$GITHUB_STEP_SUMMARY"

  build-lin-win:
    name: Build ${{ matrix.platform }}
    needs: plan
    if: needs.plan.outputs.channel != 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    container:
      # rack-sdk-2.6.6
      image: ghcr.io/bloodbat/rack-plugin-toolchain-win-linux@sha256:d49eaf94ea3f1e29f547d920cc5a50ff8339f45398017d1ea7c1a79fa1dbc25f
      # The checkout is owned by root, and the toolchain builds inside it.
      options: --user root
    strategy:
      matrix:
        platform: [lin-x64, win-x64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stamp nightly version
        if: needs.plan.outputs.channel == 'nightly'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          jq --arg version "$VERSION" '.version = $version' plugin.json > plugin.json.tmp
          mv plugin.json.tmp plugin.json
      - name: Build plugin
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          # GITHUB_WORKSPACE is the path inside the container; the
          # github.workspace expression would give the host path instead.
          export PLUGIN_DIR="$GITHUB_WORKSPACE"
          # The toolchain finds its Rack SDK through $(PWD), which make -C
          # does not update.
          cd "$RACK_TOOLCHAIN_DIR"
          make -j"$(nproc)" "plugin-build-$PLATFORM"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-${{ matrix.platform }}
          path: ${{ env.RACK_TOOLCHAIN_DIR }}/plugin-build
          if-no-files-found: error
          # Artifacts only carry files to the release job, and they count
          # against the Actions storage quota while they exist.
          retention-days: 1
          # A .vcvplugin is already compressed.
          compression-level: 0

  build-mac:
    name: Build ${{ matrix.platform }}
    needs: plan
    if: needs.plan.outputs.channel != 'none'
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - platform: mac-arm64
            target: arm64-apple-darwin
            sdk-sha256: 29414e52417992cbafa47e30f947c3c0c7a34e5c424bb83c5a0af8c24840481f
          - platform: mac-x64
            target: x86_64-apple-darwin
            sdk-sha256: 9b8b0d7582ca25fac879f8f64de40f2481df2fd903b65f3abb5d6801689060ec
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stamp nightly version
        if: needs.plan.outputs.channel == 'nightly'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          jq --arg version "$VERSION" '.version = $version' plugin.json > plugin.json.tmp
          mv plugin.json.tmp plugin.json
      - name: Get Rack SDK
        env:
          PLATFORM: ${{ matrix.platform }}
          SDK_SHA256: ${{ matrix.sdk-sha256 }}
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/Rack-SDK.zip" \
            "https://vcvrack.com/downloads/Rack-SDK-$RACK_SDK_VERSION-$PLATFORM.zip"
          echo "$SDK_SHA256  $RUNNER_TEMP/Rack-SDK.zip" | shasum --algorithm 256 --check
          unzip -q "$RUNNER_TEMP/Rack-SDK.zip" -d "$RUNNER_TEMP"
      - name: Build plugin
        env:
          # Both architectures build on the same Apple silicon runner.
          CROSS_COMPILE: ${{ matrix.target }}
        run: |
          export RACK_DIR="$RUNNER_TEMP/Rack-SDK"
          make dep
          make -j"$(sysctl -n hw.logicalcpu)" dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-${{ matrix.platform }}
          path: dist/*.vcvplugin
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  release:
    name: Release (${{ needs.plan.outputs.channel }})
    needs: [plan, build-lin-win, build-mac]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # creates the release and its tag, removes the previous nightly
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CHANNEL: ${{ needs.plan.outputs.channel }}
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release notes need the full history and the release tags.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: plugin-*
          path: _artifacts
      - name: Collect packages
        run: |
          mkdir dist
          find _artifacts -type f -name "*-$VERSION-*.vcvplugin" -exec mv -t dist {} +
          count=$(find dist -type f | wc -l)
          if [[ $count -ne 4 ]]; then
            echo "::error::Expected 4 packages for version $VERSION, found $count."
            exit 1
          fi
          (cd dist && sha256sum -- *.vcvplugin | tee SHA256SUMS)
      - name: Write release notes
        run: |
          previous=$(git for-each-ref --count=1 --sort=-version:refname \
            --format='%(refname:short)' 'refs/tags/v[0-9]*')
          {
            if [[ $CHANNEL == nightly ]]; then
              echo "Nightly build of \`dev\` at ${GITHUB_SHA::7}. This is a pre-release for testing."
              echo
            fi
            if [[ -n $previous ]]; then
              echo "## Changes since $previous"
              echo
              changes=$(git log --no-merges --pretty='format:* %s (%h)' "$previous..HEAD")
            else
              echo "## Changes"
              echo
              changes=$(git log --no-merges --pretty='format:* %s (%h)')
            fi
            echo "${changes:-* No changes.}"
          } > notes.md
          cat notes.md
      - name: Publish release
        run: |
          if [[ $CHANNEL == nightly ]]; then
            # The nightly is one rolling release. Recreating it moves the tag to
            # the commit that was built and leaves a single set of files.
            if gh release view "$TAG" > /dev/null 2>&1; then
              gh release delete "$TAG" --cleanup-tag --yes
            fi
            # A tag can outlive its release, and would pin the new one to an old commit.
            leftover=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" \
              --jq "map(select(.ref == \"refs/tags/$TAG\")) | length")
            if [[ $leftover -ne 0 ]]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG"
            fi
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" \
              --title "Nightly $VERSION" --notes-file notes.md --prerelease --latest=false
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" \
              --title "Release $TAG" --notes-file notes.md --latest
          fi
          gh release view "$TAG" --json url --jq '"Published " + .url' >> "$GITHUB_STEP_SUMMARY"
